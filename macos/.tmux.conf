# .tmux.conf
# change the prefix from 'C-b' to 'C-a'
# (remap capslock to CTRL for easy access)
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

bind -n M-n new-window

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# split panes using | and -, make sure they open in the same path
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# kill no confirmation
bind x kill-pane

unbind '"'
unbind %

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# reload config file
bind r source-file ~/.tmux.conf

unbind p
bind p previous-window

# shorten command delay
set -sg escape-time 1

# don't rename windows automatically
set -g allow-rename on

set -g mouse on
# mouse control (clickable windows, panes, resizable panes)

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# enable vi mode keys
set-window-option -g mode-keys vi

# set default terminal mode to 256 colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# present a menu of URLs to open from the visible pane. sweet.
bind u capture-pane \;\
    save-buffer /tmp/tmux-buffer \;\
    split-window -l 10 "urlview /tmp/tmux-buffer"


# Design Tweaks
# -------------

# loud or quiet?
set -g visual-activity on
set -g visual-bell on
set -g visual-silence off
set -g monitor-activity off
set -g bell-action none

# modes
set -g clock-mode-colour yellow
set -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

set -g window-status-current-style 'fg=black bg=red'
set -g window-status-current-format '#[reverse]#[noreverse]#I #W#[reverse]#[noreverse]'

set -g window-status-style 'fg=red bg=black'
set -g window-status-separator ''
set -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

set -g window-status-bell-style 'fg=yellow bg=red bold'

# statusbar - left
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'
set -g status-left '#{?client_prefix,#[fg=green],#[fg=red]}'

# statusbar - right
set -g status-right-style 'fg=black bg=yellow'
set -g status-right '#[reverse]#[noreverse]#S %Y-%m-%d %H:%M#[reverse]#[noreverse]'

# messages
set -g message-style 'fg=yellow bg=black bold'
